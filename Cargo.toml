[package]
name = "tohdohboard-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tohdoh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
comfy-table = "7.1"
dirs = "5.0"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
